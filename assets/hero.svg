<svg width="850" height="440" viewBox="0 0 850 440" fill="none" xmlns="http://www.w3.org/2000/svg" xml:space="preserve">
  <style>
    text {
      font-family: "SFMono-Regular", "SF Mono", Consolas, "Liberation Mono", Menlo, monospace;
      white-space: pre;
    }
    .code { font-size: 13px; }
    .ln   { font-size: 11px; fill: #3b4261; text-anchor: end; }
    .tab  { font-size: 12px; fill: #c0caf5; }

    .kw  { fill: #bb9af7; }
    .ty  { fill: #7dcfff; }
    .fn  { fill: #7aa2f7; }
    .st  { fill: #9ece6a; }
    .op  { fill: #89ddff; }
    .fg  { fill: #c0caf5; }
    .cm  { fill: #565f89; font-style: italic; }
    .an  { fill: #e0af68; }

    .screen { animation: screen 14s linear infinite; }
    @keyframes screen {
      0%, 91%   { opacity: 1; }
      96%, 100% { opacity: 0; }
    }

    .t1  { animation: t1 14s linear infinite; }
    .t2  { animation: t2 14s linear infinite; }
    .t3  { animation: t3 14s linear infinite; }
    .t4  { animation: t4 14s linear infinite; }
    .t5  { animation: t5 14s linear infinite; }
    .t7  { animation: t7 14s linear infinite; }
    .t8  { animation: t8 14s linear infinite; }
    .t9  { animation: t9 14s linear infinite; }
    .t10 { animation: t10 14s linear infinite; }
    .t11 { animation: t11 14s linear infinite; }
    .t12 { animation: t12 14s linear infinite; }

    @keyframes t1  { 0%, 2%    { clip-path: inset(0 100% 0 0); animation-timing-function: steps(27, end); } 4.2%, 100%  { clip-path: inset(0 -2% 0 0); } }
    @keyframes t2  { 0%, 4.7%  { clip-path: inset(0 100% 0 0); animation-timing-function: steps(37, end); } 6.9%, 100%  { clip-path: inset(0 -2% 0 0); } }
    @keyframes t3  { 0%, 7.4%  { clip-path: inset(0 100% 0 0); animation-timing-function: steps(30, end); } 9.4%, 100%  { clip-path: inset(0 -2% 0 0); } }
    @keyframes t4  { 0%, 9.9%  { clip-path: inset(0 100% 0 0); animation-timing-function: steps(37, end); } 12.1%, 100% { clip-path: inset(0 -2% 0 0); } }
    @keyframes t5  { 0%, 12.4% { clip-path: inset(0 100% 0 0); animation-timing-function: steps(4, end);  } 13%, 100%   { clip-path: inset(0 -2% 0 0); } }
    @keyframes t7  { 0%, 13.4% { clip-path: inset(0 100% 0 0); animation-timing-function: steps(11, end); } 14.6%, 100% { clip-path: inset(0 -2% 0 0); } }
    @keyframes t8  { 0%, 15%   { clip-path: inset(0 100% 0 0); animation-timing-function: steps(28, end); } 16.8%, 100% { clip-path: inset(0 -2% 0 0); } }
    @keyframes t9  { 0%, 17.2% { clip-path: inset(0 100% 0 0); animation-timing-function: steps(27, end); } 19%, 100%   { clip-path: inset(0 -2% 0 0); } }
    @keyframes t10 { 0%, 19.4% { clip-path: inset(0 100% 0 0); animation-timing-function: steps(34, end); } 21.4%, 100% { clip-path: inset(0 -2% 0 0); } }
    @keyframes t11 { 0%, 21.8% { clip-path: inset(0 100% 0 0); animation-timing-function: steps(4, end);  } 22.4%, 100% { clip-path: inset(0 -2% 0 0); } }
    @keyframes t12 { 0%, 22.8% { clip-path: inset(0 100% 0 0); animation-timing-function: steps(2, end);  } 23.2%, 100% { clip-path: inset(0 -2% 0 0); } }

    .reload { animation: reload 14s linear infinite; }
    @keyframes reload {
      0%, 26%     { opacity: 0; }
      26.1%, 100% { opacity: 1; }
    }

    .p1 { animation: pop 14s linear infinite; animation-name: p1; }
    .p2 { animation: p2 14s linear infinite; }
    .p3 { animation: p3 14s linear infinite; }
    .p4 { animation: p4 14s linear infinite; }
    .p5 { animation: p5 14s linear infinite; }
    .p6 { animation: p6 14s linear infinite; }
    .p7 { animation: p7 14s linear infinite; }

    @keyframes p1 { 0%, 30%   { opacity: 0; transform: translateY(8px); } 32.5%, 100% { opacity: 1; transform: none; } }
    @keyframes p2 { 0%, 33%   { opacity: 0; transform: translateY(8px); } 35.5%, 100% { opacity: 1; transform: none; } }
    @keyframes p3 { 0%, 35.5% { opacity: 0; transform: translateY(8px); } 38%, 100%   { opacity: 1; transform: none; } }
    @keyframes p4 { 0%, 38%   { opacity: 0; transform: translateY(8px); } 40.5%, 100% { opacity: 1; transform: none; } }
    @keyframes p5 { 0%, 40.5% { opacity: 0; transform: translateY(8px); } 43%, 100%   { opacity: 1; transform: none; } }
    @keyframes p6 { 0%, 43%   { opacity: 0; transform: translateY(8px); } 45.5%, 100% { opacity: 1; transform: none; } }
    @keyframes p7 { 0%, 46%   { opacity: 0; transform: translateY(8px); } 48.5%, 100% { opacity: 1; transform: none; } }

    @media (prefers-reduced-motion: reduce) {
      .screen, .t1, .t2, .t3, .t4, .t5, .t7, .t8, .t9, .t10, .t11, .t12,
      .reload, .p1, .p2, .p3, .p4, .p5, .p6, .p7 {
        animation: none !important;
        clip-path: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
    }
  </style>

  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="850" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#7dcfff"/>
      <stop offset="0.5" stop-color="#bb9af7"/>
      <stop offset="1"   stop-color="#9ece6a"/>
    </linearGradient>
    <linearGradient id="avatar" x1="615" y1="90" x2="675" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7dcfff"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
  </defs>

  <!-- ===== editor ===== -->
  <rect x="2.5" y="12.5" width="470" height="415" rx="13.5" fill="#1a1b26" stroke="url(#frame)" stroke-opacity="0.45"/>
  <!-- aba -->
  <circle cx="26" cy="36" r="6" fill="#f7768e"/>
  <circle cx="46" cy="36" r="6" fill="#e0af68"/>
  <circle cx="66" cy="36" r="6" fill="#9ece6a"/>
  <rect x="96" y="22" width="120" height="28" rx="6" fill="#16161e"/>
  <circle cx="112" cy="36" r="4" fill="#7dcfff"/>
  <text class="tab" x="124" y="40">profile.dart</text>
  <line x1="2.5" y1="56" x2="472.5" y2="56" stroke="#24283b"/>

  <g class="screen">
    <!-- numeros de linha -->
    <text class="ln" x="34" y="86">1</text>
    <text class="ln" x="34" y="110">2</text>
    <text class="ln" x="34" y="134">3</text>
    <text class="ln" x="34" y="158">4</text>
    <text class="ln" x="34" y="182">5</text>
    <text class="ln" x="34" y="206">6</text>
    <text class="ln" x="34" y="230">7</text>
    <text class="ln" x="34" y="254">8</text>
    <text class="ln" x="34" y="278">9</text>
    <text class="ln" x="34" y="302">10</text>
    <text class="ln" x="34" y="326">11</text>
    <text class="ln" x="34" y="350">12</text>

    <!-- codigo -->
    <text class="code t1" x="48" y="86"><tspan class="cm">// fail again, fail better.</tspan></text>
    <text class="code t2" x="48" y="110"><tspan class="kw">class</tspan><tspan class="ty"> Marcos </tspan><tspan class="kw">extends</tspan><tspan class="ty"> MobileEngineer</tspan><tspan class="fg"> {</tspan></text>
    <text class="code t3" x="48" y="134"><tspan class="fg">  </tspan><tspan class="kw">final</tspan><tspan class="ty"> List&lt;String&gt;</tspan><tspan class="fg"> stack </tspan><tspan class="op">=</tspan><tspan class="fg"> [</tspan></text>
    <text class="code t4" x="48" y="158"><tspan class="fg">    </tspan><tspan class="st">'Flutter'</tspan><tspan class="fg">, </tspan><tspan class="st">'React Native'</tspan><tspan class="fg">, </tspan><tspan class="st">'Vue'</tspan><tspan class="fg">,</tspan></text>
    <text class="code t5" x="48" y="182"><tspan class="fg">  ];</tspan></text>
    <text class="code t7" x="48" y="230"><tspan class="an">  @override</tspan></text>
    <text class="code t8" x="48" y="254"><tspan class="fg">  </tspan><tspan class="ty">Widget</tspan><tspan class="fn"> build</tspan><tspan class="fg">() </tspan><tspan class="op">=&gt;</tspan><tspan class="ty"> Profile</tspan><tspan class="fg">(</tspan></text>
    <text class="code t9" x="48" y="278"><tspan class="fg">    name: </tspan><tspan class="st">'Marcos Pereira'</tspan><tspan class="fg">,</tspan></text>
    <text class="code t10" x="48" y="302"><tspan class="fg">    focus: </tspan><tspan class="st">'apps that feel right'</tspan><tspan class="fg">,</tspan></text>
    <text class="code t11" x="48" y="326"><tspan class="fg">  );</tspan></text>
    <text class="code t12" x="48" y="350"><tspan class="fg">}</tspan></text>

    <!-- barra de status -->
    <g class="reload">
      <line x1="2.5" y1="392" x2="472.5" y2="392" stroke="#24283b"/>
      <text x="16" y="413" font-size="11" fill="#9ece6a">&#9889; hot reload &#183; 0.3s</text>
      <text x="456" y="413" font-size="11" fill="#565f89" text-anchor="end">dart &#183; utf-8</text>
    </g>
  </g>

  <!-- ===== celular ===== -->
  <rect x="565" y="20" width="190" height="400" rx="30" fill="#1a1b26" stroke="url(#frame)" stroke-opacity="0.7" stroke-width="1.5"/>
  <rect x="573" y="28" width="174" height="384" rx="23" fill="#16161e"/>
  <circle cx="660" cy="44" r="4" fill="#0a0a14"/>
  <rect x="633" y="398" width="54" height="4" rx="2" fill="#2a2e42"/>

  <g class="screen">
    <!-- ui construida pelo codigo -->
    <g class="p1">
      <circle cx="660" cy="120" r="30" fill="url(#avatar)" fill-opacity="0.18" stroke="url(#avatar)" stroke-width="1.5"/>
      <text x="660" y="126" font-size="17" font-weight="bold" fill="#c0caf5" text-anchor="middle">MP</text>
    </g>
    <g class="p2">
      <text x="660" y="174" font-size="14" font-weight="600" fill="#c0caf5" text-anchor="middle">Marcos Pereira</text>
    </g>
    <g class="p3">
      <text x="660" y="193" font-size="10" fill="#565f89" text-anchor="middle">Mobile Software Engineer</text>
    </g>
    <g class="p4">
      <rect x="603" y="215" width="66" height="22" rx="11" fill="#1a1b26" stroke="#7dcfff"/>
      <text x="636" y="230" font-size="11" fill="#7dcfff" text-anchor="middle">Flutter</text>
    </g>
    <g class="p5">
      <rect x="677" y="215" width="40" height="22" rx="11" fill="#1a1b26" stroke="#9ece6a"/>
      <text x="697" y="230" font-size="11" fill="#9ece6a" text-anchor="middle">Vue</text>
    </g>
    <g class="p6">
      <rect x="610" y="245" width="99" height="22" rx="11" fill="#1a1b26" stroke="#bb9af7"/>
      <text x="659.5" y="260" font-size="11" fill="#bb9af7" text-anchor="middle">React Native</text>
    </g>
    <g class="p7">
      <text x="660" y="305" font-size="11" font-style="italic" fill="#e0af68" text-anchor="middle">"apps that feel right"</text>
    </g>
  </g>
</svg>
